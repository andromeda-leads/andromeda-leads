    <circle cx="280" cy="330" r="10"/>
    <circle cx="400" cy="330" r="10"/>
    <circle cx="520" cy="330" r="10"/>
    <circle cx="680" cy="470" r="13"/>
  </g>
  <g fill="#0B2231" stroke="#71CAEF" stroke-opacity="0.75" stroke-width="2">
